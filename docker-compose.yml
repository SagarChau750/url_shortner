version: "3.9"

services:

  app:
    build: .
    container_name: url-backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - redis

    restart: unless-stopped

    networks:
      - url-network

  redis:
    image: redis:latest

    container_name: redis-server

    command: redis-server /usr/local/etc/redis/redis.conf

    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf

    restart: unless-stopped

    networks:
      - url-network

networks:
  url-network:
    driver: bridge